<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard de finanças pessoais desenvolvido com JavaScript.">
  <title>Finanças Pessoais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">PORTFÓLIO • JAVASCRIPT</p>
        <h1>Finanças Pessoais</h1>
        <p class="subtitle">Controle suas receitas e despesas de forma simples.</p>
      </div>
      <button id="clearAll" class="btn btn-danger">Limpar dados</button>
    </header>

    <section class="summary-grid" aria-label="Resumo financeiro">
      <article class="card summary-card">
        <span>Saldo</span>
        <strong id="balance">R$ 0,00</strong>
      </article>
      <article class="card summary-card">
        <span>Receitas</span>
        <strong id="income">R$ 0,00</strong>
      </article>
      <article class="card summary-card">
        <span>Despesas</span>
        <strong id="expense">R$ 0,00</strong>
      </article>
    </section>

    <section class="content-grid">
      <article class="card">
        <div class="section-title">
          <h2>Nova transação</h2>
          <span>+ adicionar</span>
        </div>

        <form id="transactionForm">
          <label>
            Descrição
            <input id="description" type="text" placeholder="Ex.: Salário" required maxlength="60">
          </label>

          <label>
            Valor
            <input id="amount" type="number" placeholder="0,00" min="0.01" step="0.01" required>
          </label>

          <label>
            Tipo
            <select id="type">
              <option value="income">Receita</option>
              <option value="expense">Despesa</option>
            </select>
          </label>

          <label>
            Categoria
            <select id="category">
              <option>Salário</option>
              <option>Alimentação</option>
              <option>Transporte</option>
              <option>Moradia</option>
              <option>Lazer</option>
              <option>Educação</option>
              <option>Outros</option>
            </select>
          </label>

          <button class="btn btn-primary" type="submit">Adicionar transação</button>
        </form>
      </article>

      <article class="card">
        <div class="section-title">
          <h2>Transações</h2>
          <select id="filter">
            <option value="all">Todas</option>
            <option value="income">Receitas</option>
            <option value="expense">Despesas</option>
          </select>
        </div>
        <div id="transactionList" class="transaction-list"></div>
      </article>
    </section>

    <footer>
      <span>Projeto de portfólio • HTML + CSS + JavaScript</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
